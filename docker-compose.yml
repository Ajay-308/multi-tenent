version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    command: npm run dev
    ports: ["4000:4000"]
    env_file: .env
    depends_on: [postgres, redis]
    volumes: ["./src:/app/src"]

  worker:
    build: .
    command: npm run worker
    env_file: .env
    depends_on: [postgres, redis]
    volumes: ["./src:/app/src"]

volumes:
  pgdata:
