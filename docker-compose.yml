version: "3.9"
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    command: npm run dev
    ports: ["4000:4000"]
    env_file: .env
    depends_on: [redis]
    volumes: ["./src:/app/src"]

  worker:
    build: .
    command: npm run worker
    env_file: .env
    depends_on: [redis]
    volumes: ["./src:/app/src"]
